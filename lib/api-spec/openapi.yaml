          n,
          accuracy,
          logLoss,
          brier,
          dateRangeStart,
          dateRangeEnd,
          retiredCount,
          retiredAccuracy,
          voidCount,
          missedCount,
          eceRaw,
          eceCalibrated,
        ]
      properties:
