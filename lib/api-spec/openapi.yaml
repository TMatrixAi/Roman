openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Tennis prediction engine API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: players
    description: Player search and profiles
  - name: matchups
    description: Head-to-head and fixtures
  - name: predictions
    description: Prediction engine
  - name: provider
    description: Data provider status
  - name: evaluation
    description: Out-of-sample testing, calibration, and paper trading (Phase 4)
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /provider/status:
    get:
      operationId: getProviderStatus
      tags: [provider]
      summary: Data provider status
      description: Reports which live tennis-data provider is active and when it last responded successfully
      responses:
        "200":
          description: Provider status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderStatus"

  /players/search:
    get:
      operationId: searchPlayers
      tags: [players]
      summary: Search players by name
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
            minLength: 2
      responses:
        "200":
          description: Matching players
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlayerSummary"
        "502":
          description: Upstream data provider unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderError"

  /players/{playerId}:
    get:
      operationId: getPlayer
      tags: [players]
      summary: Get a player profile
      parameters:
        - name: playerId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Player profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerProfile"
        "404":
          description: Player not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderError"
        "502":
          description: Upstream data provider unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderError"

  /players/{playerId}/matches:
    get:
      operationId: getPlayerMatches
      tags: [players]
      summary: Recent match history for a player (all surfaces, most recent first)
      parameters:
        - name: playerId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Match history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MatchRecord"
        "502":
          description: Upstream data provider unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderError"

  /fixtures/upcoming:
    get:
      operationId: getUpcomingFixtures
      tags: [matchups]
      summary: Upcoming scheduled matches
      description: >-
        Returns a rolling now-forward window of matches with a start time at or after the current
        instant, sorted soonest-first, regardless of which calendar day (UTC) they fall on. The
        window auto-extends further out when the near-term days are sparse, so the result is
        capped by `limit` rather than by a fixed clock/day boundary.
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum number of fixtures to return. Defaults to 50.
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: Upcoming fixtures
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Fixture"
        "502":
          description: Upstream data provider unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderError"

  /h2h:
    get:
      operationId: getHeadToHead
      tags: [matchups]
      summary: Head-to-head match list between two players
      parameters:
        - name: player1Id
          in: query
          required: true
          schema:
            type: string
        - name: player2Id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Head-to-head record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeadToHeadRecord"
        "502":
          description: Upstream data provider unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderError"

  /predictions:
    get:
      operationId: listPredictions
      tags: [predictions]
      summary: List saved predictions (most recent first)
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: Prediction history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PredictionSummary"
    post:
      operationId: createPrediction
      tags: [predictions]
      summary: Run the prediction engine for a matchup and save the result
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PredictionRequest"
      responses:
        "201":
          description: Prediction generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prediction"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderError"
        "502":
          description: Upstream data provider unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderError"

  /predictions/stats:
    get:
      operationId: getPredictionStats
      tags: [predictions]
      summary: Aggregate stats across saved predictions
      responses:
        "200":
          description: Aggregate stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PredictionStats"

  /predictions/{predictionId}:
    get:
      operationId: getPrediction
      tags: [predictions]
      summary: Get a saved prediction with its full engine breakdown
      parameters:
        - name: predictionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Prediction detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prediction"
        "404":
          description: Prediction not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderError"
    delete:
      operationId: deletePrediction
      tags: [predictions]
      summary: Permanently delete a single saved prediction from the Ledger
      parameters:
        - name: predictionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Prediction not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderError"

  /predictions/bulk-delete:
    post:
      operationId: bulkDeletePredictions
      tags: [predictions]
      summary: Permanently delete multiple saved predictions from the Ledger at once
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkDeletePredictionsInput"
      responses:
        "200":
          description: Number of predictions actually deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkDeletePredictionsResult"

  /predictions/grade-pending:
    post:
      operationId: gradePendingLedgerPredictions
      tags: [predictions]
      summary: Check every still-pending Ledger prediction against real completed-match data and mark Win/Loss automatically (also runs on a schedule; this triggers an on-demand check, e.g. from a "Refresh Outcomes" button)
      responses:
        "200":
          description: Grading summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LedgerGradingSummary"
        "502":
          description: Upstream data provider unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderError"

  /predictions/duplicates/preview:
    post:
      operationId: previewDuplicatePredictions
      tags: [predictions]
      summary: Scan the entire Ledger for true duplicate predictions (without deleting anything) so the UI can show a confirmation before removing them
      responses:
        "200":
          description: Duplicate groups found, and how many rows would be removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DuplicatePredictionsPreviewResult"

  /predictions/duplicates/remove:
    post:
      operationId: removeDuplicatePredictions
      tags: [predictions]
      summary: Re-scan the entire Ledger for true duplicate predictions and delete only the duplicate rows, keeping the original of each group
      responses:
        "200":
          description: Duplicates removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemoveDuplicatePredictionsResult"

  /predictions/{predictionId}/outcome:
    patch:
      operationId: recordPredictionOutcome
      tags: [predictions]
      summary: Record the actual match winner for a saved prediction
      parameters:
        - name: predictionId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PredictionOutcomeInput"
      responses:
        "200":
          description: Updated prediction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prediction"
        "404":
          description: Prediction not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderError"

  /evaluation/runs:
    get:
      operationId: listEvaluationRuns
      tags: [evaluation]
      summary: List walk-forward fold results (most recent first)
      responses:
        "200":
          description: Fold results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EvaluationRun"

  /evaluation/walk-forward/run:
    post:
      operationId: runWalkForward
      tags: [evaluation]
      summary: Run a fresh sequence of expanding-window walk-forward folds over the historical store
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunWalkForwardRequest"
      responses:
        "200":
          description: Walk-forward run summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalkForwardSummary"

  /evaluation/predictions:
    get:
      operationId: listEvaluationPredictions
      tags: [evaluation]
      summary: List locked evaluation predictions (historical-test, paper-trade, or live)
      parameters:
        - name: runKind
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/RunKind"
        - name: segment
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Segment"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/EvaluationStatus"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Evaluation predictions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EvaluationPrediction"

  /evaluation/predictions/{predictionId}:
    get:
      operationId: getEvaluationPrediction
      tags: [evaluation]
      summary: Get one locked evaluation prediction with its full feature snapshot
      parameters:
        - name: predictionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Evaluation prediction detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluationPrediction"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderError"

  /evaluation/dashboard:
    get:
      operationId: getEvaluationDashboard
      tags: [evaluation]
      summary: Segmented, honestly-labeled accuracy dashboard (validation / test / paper-trade never combined)
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluationDashboard"

  /evaluation/settings:
    get:
      operationId: getEvaluationSettings
      tags: [evaluation]
      summary: Get the admin-configurable evaluation settings
      responses:
        "200":
          description: Current settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PredictionSettings"
    patch:
      operationId: updateEvaluationSettings
      tags: [evaluation]
      summary: Update the admin-configurable evaluation settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePredictionSettingsRequest"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PredictionSettings"

  /evaluation/simulator:
    get:
      operationId: getSimulatorValidation
      tags: [evaluation]
      summary: Current Phase 7 Monte Carlo simulator validation status against real graded outcomes
      responses:
        "200":
          description: Simulator validation status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulatorValidation"

  /evaluation/simulator/validate:
    post:
      operationId: runSimulatorValidation
      tags: [evaluation]
      summary: Recompute the simulator's validation status from every real graded outcome currently available, and persist it
      responses:
        "200":
          description: Freshly computed simulator validation status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulatorValidation"

  /paper-trading/run-cycle:
    post:
      operationId: runPaperTradingCycle
      tags: [evaluation]
      summary: Lock predictions for newly-eligible upcoming fixtures, mark missed cutoffs, and grade completed matches
      responses:
        "200":
          description: Cycle summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaperTradingCycleSummary"

  /paper-trading/job-runs:
    get:
      operationId: listPaperTradingJobRuns
      tags: [evaluation]
      summary: Recent invocations of the standalone paper-trading scheduled job, for monitoring gaps or failures
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Most recent job runs, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JobRun"

  /evaluation/ablation/run:
    post:
      operationId: runAblationAnalysis
      tags: [evaluation]
      summary: Start a one-time model ablation analysis (leave-one-out + combinations, replayed over the historical corpus). Runs in the background -- poll /evaluation/ablation/status for progress and the finished report.
      responses:
        "200":
          description: Whether the run was started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AblationRunResponse"

  /evaluation/ablation/status:
    get:
      operationId: getAblationStatus
      tags: [evaluation]
      summary: Poll the status/progress/result of the model ablation analysis job
      responses:
        "200":
          description: Current job status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AblationStatus"

  /evaluation/calibration-refit/job-runs:
    get:
      operationId: listCalibrationRefitJobRuns
      tags: [evaluation]
      summary: Recent invocations of the standalone calibration-refit scheduled job, for monitoring gaps or failures
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Most recent job runs, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JobRun"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ProviderError:
      type: object
      required: [error]
      properties:
        error:
          type: string
        detail:
          type: ["string", "null"]

    ProviderStatus:
      type: object
      required: [provider, connected, lastSuccessfulCallAt, lastError]
      properties:
        provider:
          type: string
          description: Name of the active tennis data provider
        connected:
          type: boolean
        lastSuccessfulCallAt:
          type: ["string", "null"]
          format: date-time
        lastError:
          type: ["string", "null"]

    Surface:
      type: string
      enum: [Hard, Clay, Grass, IndoorHard]

    TournamentLevel:
      type: string
      enum: [GrandSlam, Masters1000, ATP500, ATP250, WTA1000, WTA500, WTA250, Challenger, ITF, Other]

    MatchFormat:
      type: string
      enum: [BestOf3, BestOf5]

    PlayerSummary:
      type: object
      required: [id, name, countryCode]
      properties:
        id:
          type: string
        name:
          type: string
        countryCode:
          type: ["string", "null"]
        currentRank:
          type: ["integer", "null"]
        tour:
          type: ["string", "null"]
        source:
          type: string
          enum: [live-standings, historical-match]
          description: >-
            How this player was found. "live-standings" means they're in the current ATP/WTA
            standings feed (rank/tour are live). "historical-match" means they were found only in
            our own previously-fetched real match history -- a genuinely real player, but rank/tour
            here reflect their last known match, not a live ranking. Omitted for legacy rows.

    PlayerProfile:
      type: object
      required: [id, name, countryCode]
      properties:
        id:
          type: string
        name:
          type: string
        countryCode:
          type: ["string", "null"]
        currentRank:
          type: ["integer", "null"]
        age:
          type: ["number", "null"]
        plays:
          type: ["string", "null"]
          description: Playing hand, e.g. "Right-handed"
        tour:
          type: ["string", "null"]
        fullName:
          type: ["string", "null"]
          description: Provider's full given+family name, when it differs from the display name.
        source:
          type: string
          enum: [live-standings, historical-match]
          description: >-
            How tour/rank were resolved. "live-standings" means the current ATP/WTA standings feed
            had this player. "historical-match" means the standings feed didn't have them, but a
            real, previously-fetched match record did (tour reflects their last known match, not a
            live ranking). Omitted when neither source could resolve tour/rank at all.

    MatchStatLine:
      type: object
      description: Raw serve/return counting stats for one player in one match, when the provider supplies them
      properties:
        firstServePct:
          type: ["number", "null"]
        firstServeWon:
          type: ["number", "null"]
        secondServeWon:
          type: ["number", "null"]
        aces:
          type: ["integer", "null"]
        doubleFaults:
          type: ["integer", "null"]
        breakPointsSaved:
          type: ["number", "null"]
        breakPointsFaced:
          type: ["integer", "null"]
        returnPointsWon:
          type: ["number", "null"]

    MatchRecord:
      type: object
      required: [id, date, opponentId, opponentName, opponentRank, surface, result]
      properties:
        id:
          type: string
        date:
          type: string
          format: date
        tournamentName:
          type: ["string", "null"]
        tournamentLevel:
          oneOf:
            - $ref: "#/components/schemas/TournamentLevel"
            - type: "null"
        round:
          type: ["string", "null"]
        matchFormat:
          $ref: "#/components/schemas/MatchFormat"
        surface:
          oneOf:
            - $ref: "#/components/schemas/Surface"
            - type: "null"
        indoor:
          type: ["boolean", "null"]
        opponentId:
          type: string
        opponentName:
          type: string
        opponentRank:
          type: ["integer", "null"]
        result:
          type: string
          enum: [W, L]
        score:
          type: ["string", "null"]
        retired:
          type: boolean
        walkover:
          type: boolean
        stats:
          oneOf:
            - $ref: "#/components/schemas/MatchStatLine"
            - type: "null"
        opponentStats:
          oneOf:
            - $ref: "#/components/schemas/MatchStatLine"
            - type: "null"

    Fixture:
      type: object
      required: [id, date, timeConfirmed, player1Id, player1Name, player2Id, player2Name, surface]
      properties:
        id:
          type: string
        date:
          type: string
          format: date
          description: Calendar date the match is scheduled for (YYYY-MM-DD). Always present.
        scheduledStart:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
          description: Full real start instant (UTC) for this exact fixture, combining the provider's per-match date and time. Null when the provider did not supply a verified time for this fixture -- never fabricated or shared with another match. Clients must show "Time TBD" when null.
        timeConfirmed:
          type: boolean
          description: True only when scheduledStart reflects a real provider-supplied time for this exact fixture.
        tournamentName:
          type: ["string", "null"]
        tournamentLevel:
          oneOf:
            - $ref: "#/components/schemas/TournamentLevel"
            - type: "null"
        round:
          type: ["string", "null"]
        surface:
          oneOf:
            - $ref: "#/components/schemas/Surface"
            - type: "null"
        indoor:
          type: ["boolean", "null"]
        matchFormat:
          $ref: "#/components/schemas/MatchFormat"
        player1Id:
          type: string
        player1Name:
          type: string
        player2Id:
          type: string
        player2Name:
          type: string

    HeadToHeadMeeting:
      type: object
      required: [date, winnerId, surface]
      properties:
        date:
          type: string
          format: date
        tournamentName:
          type: ["string", "null"]
        surface:
          oneOf:
            - $ref: "#/components/schemas/Surface"
            - type: "null"
        score:
          type: ["string", "null"]
        winnerId:
          type: string

    HeadToHeadRecord:
      type: object
      required: [player1Id, player2Id, meetings]
      properties:
        player1Id:
          type: string
        player2Id:
          type: string
        meetings:
          type: array
          items:
            $ref: "#/components/schemas/HeadToHeadMeeting"

    PredictionRequest:
      type: object
      required: [player1Id, player2Id, surface, matchFormat]
      properties:
        player1Id:
          type: string
        player2Id:
          type: string
        surface:
          $ref: "#/components/schemas/Surface"
        matchFormat:
          $ref: "#/components/schemas/MatchFormat"
        tournamentLevel:
          $ref: "#/components/schemas/TournamentLevel"
        tournamentName:
          type: ["string", "null"]
        indoor:
          type: ["boolean", "null"]

    PredictionOutcomeInput:
      type: object
      required: [actualWinnerId]
      properties:
        actualWinnerId:
          type: string

    EngineModelOutput:
      type: object
      description: Standard shape every prediction-engine module returns
      required: [player1Edge, player2Edge, reliability, summary]
      properties:
        player1Edge:
          type: number
          description: Signed edge toward player 1, roughly -50..50
        player2Edge:
          type: number
        reliability:
          type: number
          description: 0-100 confidence in this module's inputs
        summary:
          type: string
        warnings:
          type: array
          items:
            type: string

    SurfaceEloResult:
      type: object
      required: [player1SurfaceElo, player2SurfaceElo, eloDifference, eloWinProbabilityPlayer1, reliability, sampleSizePlayer1, sampleSizePlayer2]
      properties:
        player1SurfaceElo:
          type: number
        player2SurfaceElo:
          type: number
        eloDifference:
          type: number
        eloWinProbabilityPlayer1:
          type: number
        reliability:
          type: number
        sampleSizePlayer1:
          type: integer
        sampleSizePlayer2:
          type: integer
        warnings:
          type: array
          items:
            type: string

    ServeReturnResult:
      type: object
      required: [player1ServeRating, player2ServeRating, player1ReturnRating, player2ReturnRating, reliability]
      properties:
        player1ServeRating:
          type: number
        player2ServeRating:
          type: number
        player1ReturnRating:
          type: number
        player2ReturnRating:
          type: number
        reliability:
          type: number
        note:
          type: ["string", "null"]
        warnings:
          type: array
          items:
            type: string

    RecentFormResult:
      type: object
      required: [player1Form, player2Form, player1Trend, player2Trend, reliability]
      properties:
        player1Form:
          type: number
        player2Form:
          type: number
        player1Trend:
          type: string
          enum: [improving, stable, declining]
        player2Trend:
          type: string
          enum: [improving, stable, declining]
        reliability:
          type: number
        player1OpponentAdjustedCoverage:
          type: number
          description: Share (0-100) of player1's recent matches with a real opponent-strength estimate available
        player2OpponentAdjustedCoverage:
          type: number
        warnings:
          type: array
          items:
            type: string

    FatigueResult:
      type: object
      required: [player1FatigueScore, player2FatigueScore, player1MatchesLast7Days, player2MatchesLast7Days, reliability]
      properties:
        player1FatigueScore:
          type: number
        player2FatigueScore:
          type: number
        player1MatchesLast7Days:
          type: integer
        player2MatchesLast7Days:
          type: integer
        player1MatchesLast3Days:
          type: integer
        player2MatchesLast3Days:
          type: integer
        player1MatchesLast14Days:
          type: integer
        player2MatchesLast14Days:
          type: integer
        player1EstimatedGamesLast14Days:
          type: number
        player2EstimatedGamesLast14Days:
          type: number
        reliability:
          type: number
        note:
          type: string
        warnings:
          type: array
          items:
            type: string

    PlayerAvailability:
      type: object
      required: [daysSinceLastMatch, travelDistanceKm, recentRetirementOrWithdrawal, recentRetirementTournament]
      properties:
        daysSinceLastMatch:
          type: ["integer", "null"]
          description: Exact real days since this player's most recent completed match. Null when there's no prior match on record.
        travelDistanceKm:
          type: ["number", "null"]
          description: Real great-circle distance between the venue of this player's last match and this match's venue. Null when either venue can't be resolved.
        recentRetirementOrWithdrawal:
          type: boolean
          description: True only when this player's own match record shows they retired mid-match (the losing side of a retired result) within the last 3 weeks -- a real recorded fact, not a diagnosis.
        recentRetirementTournament:
          type: ["string", "null"]

    AvailabilityResult:
      type: object
      description: Real injury/travel/rest signals derived from verified match data -- no external pre-match injury/withdrawal feed is connected (see availabilityNote).
      required: [player1, player2, reliability, note, warnings]
      properties:
        player1:
          $ref: "#/components/schemas/PlayerAvailability"
        player2:
          $ref: "#/components/schemas/PlayerAvailability"
        reliability:
          type: number
        note:
          type: string
        warnings:
          type: array
          items:
            type: string

    StyleMatchupResult:
      type: object
      required: [player1Styles, player2Styles, reliability]
      properties:
        player1Styles:
          type: array
          items:
            type: string
        player2Styles:
          type: array
          items:
            type: string
        player1Advantages:
          type: array
          items:
            type: string
        player2Advantages:
          type: array
          items:
            type: string
        reliability:
          type: number
        warnings:
          type: array
          items:
            type: string

    HeadToHeadResult:
      type: object
      required: [player1Wins, player2Wins, surfaceMeetings, reliability]
      properties:
        player1Wins:
          type: integer
        player2Wins:
          type: integer
        surfaceMeetings:
          type: integer
        recentMeetings:
          type: integer
        weightedEdge:
          type: number
          description: Recency- and tournament-level-weighted edge toward player1, -1..1
        reliability:
          type: number
        warnings:
          type: array
          items:
            type: string

    WeatherConditions:
      type: object
      description: Forecast conditions for a genuinely upcoming fixture with a known venue -- informational only, never used to adjust win probability.
      required: [venueName, temperatureC, windSpeedKph, precipitationProbability, note]
      properties:
        venueName:
          type: string
        temperatureC:
          type: number
        windSpeedKph:
          type: number
        precipitationProbability:
          type: number
        note:
          type: string

    ModelVote:
      type: object
      required: [modelName, player1Probability, weightUsed, reliability]
      properties:
        modelName:
          type: string
        player1Probability:
          type: number
        weightUsed:
          type: number
        reliability:
          type: number

    EngineBreakdown:
      type: object
      description: Full module-by-module output of the prediction engine
      # `availability` is intentionally NOT required: predictions saved before this field existed
      # have a stored `engine` JSON blob without it, and must still parse/read back cleanly.
      required: [surfaceElo, serveReturn, recentForm, fatigue, styleMatchup, headToHead, models]
      properties:
        surfaceElo:
          $ref: "#/components/schemas/SurfaceEloResult"
        serveReturn:
          $ref: "#/components/schemas/ServeReturnResult"
        recentForm:
          $ref: "#/components/schemas/RecentFormResult"
        fatigue:
          $ref: "#/components/schemas/FatigueResult"
        availability:
          $ref: "#/components/schemas/AvailabilityResult"
        styleMatchup:
          $ref: "#/components/schemas/StyleMatchupResult"
        headToHead:
          $ref: "#/components/schemas/HeadToHeadResult"
        models:
          type: array
          items:
            $ref: "#/components/schemas/ModelVote"
        modelAgreement:
          type: string
          enum: [Strong, Moderate, Mixed, HighDisagreement]
        disagreementNote:
          type: ["string", "null"]
          description: Recalibrated (2026-07-13) weighted-disagreement explanation naming the specific meaningfully-weighted models actually in conflict, their probabilities, and their weights. Null when modelAgreement is "Strong". Absent on predictions made before this field existed.
        matchupCloseness:
          type: string
          enum: [VeryClose, Close, Moderate, Clear]
          description: How near the final probability sits to a coin flip -- deliberately independent of modelAgreement (a match can be close while every model agrees, or genuinely disagree while the blend lands well away from 50). Absent on predictions made before this field existed.
        reasons:
          type: array
          items:
            type: string
        risks:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            type: string
          description: Aggregated low-sample/low-coverage warnings from every module
        availabilityNote:
          type: string
        conditionsNote:
          type: string
        weather:
          oneOf:
            - $ref: "#/components/schemas/WeatherConditions"
            - type: "null"
        segmentKey:
          type: ["string", "null"]
          description: Tour/surface segment key (e.g. "ATP-Clay") a specialist was evaluated for, or null when this match's tour isn't a Phase 6 candidate segment at all
        segmentLabel:
          type: ["string", "null"]
        specialistApplied:
          type: boolean
          description: True only when a segment specialist actually contributed to calibratedProbability
        segmentNote:
          type: string
          description: Always present -- explains whether a specialist was applied, or exactly why the engine fell back to the general model. Never silent.
        simulation:
          $ref: "#/components/schemas/MatchSimulationResult"
        simulatorApplied:
          type: boolean
          description: True only when the Phase 7 Monte Carlo simulator's validated performance earned it a vote in calibratedProbability
        simulatorNote:
          type: string
          description: Always present -- explains whether the simulator is voting, or exactly why not yet. Never silent.
        modelConflict:
          type: boolean
          description: True only when the final calibrated pick crosses 50% in the opposite direction from the raw, reliability-weighted feature-module vote -- i.e. calibration/specialist/simulator blending overrode the underlying evidence. Not present on predictions made before this field existed.
        modelConflictNote:
          type: ["string", "null"]
          description: Explanation of which metrics favored the other side and which pipeline stage flipped the pick. Null when there's no conflict, absent on predictions made before this field existed.
        tieBreakerApplied:
          type: boolean
          description: True only when the raw core signals were genuinely close to a coin flip and the tie-break cascade picked a direction instead of leaving an uninformative ~50/50 average. Absent on predictions made before this field existed.
        tieBreakerDecidingStep:
          type: ["string", "null"]
          description: Which cascade step decided the direction, or null when no tie-break was needed/possible.
        tieBreakerNote:
          type: ["string", "null"]
          description: Explanation of why the raw signals were tied and which step broke it. Null when tieBreakerApplied is false.
        isEliteTier:
          type: boolean
          description: True only when this prediction clears the Elite Prediction bar (high data quality, Surface Elo/Serve & Return/Recent Form agreement, a validated segment specialist, and passing fitted calibration). Absent on predictions made before this field existed.
        eliteTierReason:
          type: string
          description: Always present -- explains why a prediction is or isn't elite tier. Never silent.

    BulkDeletePredictionsInput:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          items:
            type: integer
          minItems: 1

    BulkDeletePredictionsResult:
      type: object
      required: [deletedCount]
      properties:
        deletedCount:
          type: integer

    LedgerGradingSummary:
      type: object
      required: [checked, graded, errors]
      properties:
        checked:
          type: integer
          description: Pending predictions old enough to check for a real result
        graded:
          type: integer
          description: Predictions actually marked Win/Loss this run
        errors:
          type: array
          items:
            type: string

    DuplicatePredictionGroup:
      type: object
      required: [keepId, removeIds, player1Name, player2Name, tournamentName, predictedWinnerName]
      properties:
        keepId:
          type: integer
          description: The original prediction (earliest created) kept from this duplicate group
        removeIds:
          type: array
          items:
            type: integer
          description: The duplicate prediction(s) in this group that would be/were removed
        player1Name:
          type: string
        player2Name:
          type: string
        tournamentName:
          type: ["string", "null"]
        predictedWinnerName:
          type: string

    DuplicatePredictionsPreviewResult:
      type: object
      required: [removableCount, groups]
      properties:
        removableCount:
          type: integer
          description: Total number of duplicate rows that would be removed across all groups
        groups:
          type: array
          items:
            $ref: "#/components/schemas/DuplicatePredictionGroup"

    RemoveDuplicatePredictionsResult:
      type: object
      required: [removedCount, groups]
      properties:
        removedCount:
          type: integer
          description: Total number of duplicate rows actually removed
        groups:
          type: array
          items:
            $ref: "#/components/schemas/DuplicatePredictionGroup"

    SetScoreOutcome:
      type: object
      required: [score, probability, favors]
      properties:
        score:
          type: string
          description: Set score in "winner-loser" games form, e.g. "2-0", "3-1"
        probability:
          type: number
          description: Percentage (0-100) of simulated matches that ended with this exact set score
        favors:
          type: string
          enum: [player1, player2]

    MatchSimulationResult:
      type: object
      description: Phase 7 point-by-point Monte Carlo simulation -- point/game/set/tiebreak scoring simulated thousands of times per match, with input service-point probabilities jittered within their measured reliability to produce a genuine confidence range rather than one falsely-precise number.
      required:
        [
          player1WinProbability,
          rangeLow,
          rangeHigh,
          straightSetsProbabilityPlayer1,
          straightSetsProbabilityPlayer2,
          setScoreDistribution,
          expectedGamesPlayer1,
          expectedGamesPlayer2,
          player1ServicePointProbability,
          player2ServicePointProbability,
          inputReliability,
          simulationsRun,
          note,
        ]
      properties:
        player1WinProbability:
          type: number
          description: Point-estimate probability (0-100) that player1 wins the match, from the simulation's mean
        rangeLow:
          type: number
          description: 10th percentile of player1's simulated win rate across uncertainty draws
        rangeHigh:
          type: number
          description: 90th percentile of player1's simulated win rate across uncertainty draws
        straightSetsProbabilityPlayer1:
          type: number
        straightSetsProbabilityPlayer2:
          type: number
        setScoreDistribution:
          type: array
          items:
            $ref: "#/components/schemas/SetScoreOutcome"
        expectedGamesPlayer1:
          type: number
        expectedGamesPlayer2:
          type: number
        player1ServicePointProbability:
          type: number
          description: Derived (not point-tracked) probability player1 wins a point on their own serve, 0-1
        player2ServicePointProbability:
          type: number
        inputReliability:
          type: number
          description: 0-100 -- how much the underlying surface-Elo and serve/return signals can be trusted; drives how wide the uncertainty range is
        simulationsRun:
          type: integer
        note:
          type: string

    SimulatorValidation:
      type: object
      description: Phase 7 simulator validation status against real graded outcomes -- honest either way, never silently adopted.
      required: [sampleSize, minSampleSize, adopted, weight, note]
      properties:
        sampleSize:
          type: integer
        minSampleSize:
          type: integer
        simulatorAccuracy:
          type: ["number", "null"]
        simulatorLogLoss:
          type: ["number", "null"]
        simulatorBrier:
          type: ["number", "null"]
        ensembleAccuracy:
          type: ["number", "null"]
        ensembleLogLoss:
          type: ["number", "null"]
        ensembleBrier:
          type: ["number", "null"]
        adopted:
          type: boolean
        weight:
          type: number
        note:
          type: string
        computedAt:
          type: ["string", "null"]
          format: date-time

    Recommendation:
      type: string
      enum: [STRONG_RECOMMENDATION, MODERATE_LEAN, HIGH_RISK, NO_STRONG_SIGNAL, DO_NOT_RECOMMEND]

    UpsetRisk:
      type: string
      enum: [LOW, MODERATE, HIGH, EXTREME]

    Prediction:
      type: object
      required:
        [
          id,
          player1Id,
          player1Name,
          player2Id,
          player2Name,
          surface,
          matchFormat,
          predictedWinnerId,
          predictedWinnerName,
          calibratedProbability,
          predictedWinnerProbability,
          dataQuality,
          upsetRisk,
          recommendation,
          predictedSetScore,
          engine,
          createdAt,
        ]
      properties:
        id:
          type: integer
        player1Id:
          type: string
        player1Name:
          type: string
        player2Id:
          type: string
        player2Name:
          type: string
        surface:
          $ref: "#/components/schemas/Surface"
        matchFormat:
          $ref: "#/components/schemas/MatchFormat"
        tournamentLevel:
          oneOf:
            - $ref: "#/components/schemas/TournamentLevel"
            - type: "null"
        tournamentName:
          type: ["string", "null"]
        predictedWinnerId:
          type: string
        predictedWinnerName:
          type: string
        calibratedProbability:
          type: number
          description: Calibrated win probability for player 1, 0-100
        predictedWinnerProbability:
          type: number
          description: >-
            The predicted winner's own win probability (always >= 50) -- mirrored from
            calibratedProbability when player 2 is the pick, so this can never disagree with the
            player named as predictedWinnerName. Use this for display; calibratedProbability
            stays player-1-relative for calibration/evaluation purposes.
        dataQuality:
          type: integer
        dataQualityLabel:
          type: string
          enum: [Excellent, Strong, Acceptable, Limited, Poor]
        upsetRisk:
          $ref: "#/components/schemas/UpsetRisk"
        recommendation:
          $ref: "#/components/schemas/Recommendation"
        predictedSetScore:
          type: string
        engine:
          $ref: "#/components/schemas/EngineBreakdown"
        actualWinnerId:
          type: ["string", "null"]
        actualWinnerName:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        resolvedAt:
          type: ["string", "null"]
          format: date-time

    PredictionSummary:
      type: object
      required:
        [
          id,
          player1Name,
          player2Name,
          surface,
          predictedWinnerName,
          calibratedProbability,
          predictedWinnerProbability,
          dataQuality,
          upsetRisk,
          recommendation,
          createdAt,
        ]
      properties:
        id:
          type: integer
        player1Name:
          type: string
        player2Name:
          type: string
        surface:
          $ref: "#/components/schemas/Surface"
        tournamentName:
          type: ["string", "null"]
        predictedWinnerName:
          type: string
        calibratedProbability:
          type: number
        predictedWinnerProbability:
          type: number
          description: >-
            The predicted winner's own win probability (always >= 50) -- see the field doc on
            Prediction. Use this for display instead of calibratedProbability.
        dataQuality:
          type: integer
        upsetRisk:
          $ref: "#/components/schemas/UpsetRisk"
        recommendation:
          $ref: "#/components/schemas/Recommendation"
        actualWinnerName:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    PredictionStats:
      type: object
      required: [totalPredictions, resolvedPredictions, correctPredictions, accuracy, byRecommendation]
      properties:
        totalPredictions:
          type: integer
        resolvedPredictions:
          type: integer
        correctPredictions:
          type: integer
        accuracy:
          type: ["number", "null"]
          description: correctPredictions / resolvedPredictions as a percentage, null if no resolved predictions yet
        byRecommendation:
          type: array
          items:
            type: object
            required: [recommendation, count]
            properties:
              recommendation:
                $ref: "#/components/schemas/Recommendation"
              count:
                type: integer

    RunKind:
      type: string
      enum: [historical_test, paper_trade, live]
      description: historical_test replays the leak-proof historical store; paper_trade/live lock predictions for real fixtures ahead of time

