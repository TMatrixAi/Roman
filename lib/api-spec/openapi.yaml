      type: string
      enum: [validation, test]

    EvaluationStatus:
      type: string
      enum: [pending, graded, void, missed]

    ResultType:
      type: string
      enum: [normal, retired, walkover, cancelled]

    CalibrationKnot:
      type: object
      required: [x, y]
      properties:
        x:
          type: number
