        weight:
          type: number
          description: This segment's measured blend weight (0-1) against the general model in live predictions; 0 when meetsThreshold is false
        computedAt:
          type: string
          format: date-time

    EvaluationDashboard:
      type: object
      required: [segments, activeCalibrationSampleSize, activeCalibrationMethod, specialistSegments]
      properties:
        segments:
          type: array
          items:
            $ref: "#/components/schemas/EvaluationDashboardSegment"
        activeCalibrationSampleSize:
          type: integer
          description: How many validation-segment predictions the live paper-trading calibration was fit on
        activeCalibrationMethod:
          type: ["string", "null"]
          enum: [isotonic, platt, null]
          description: Which method (isotonic or Platt/sigmoid) won the holdout comparison and is currently active
        activeCalibrationIsotonicHoldoutLogLoss:
          type: ["number", "null"]
          description: Isotonic method's log loss on the held-out comparison slice at the last refit
        activeCalibrationPlattHoldoutLogLoss:
          type: ["number", "null"]
          description: Platt method's log loss on the held-out comparison slice at the last refit
        specialistSegments:
          type: array
          items:
            $ref: "#/components/schemas/SpecialistSegmentSummary"

    PredictionSettings:
      type: object
      required: [retirementRule, paperTradeLeadMinutes]
      properties:
        retirementRule:
          type: string
          enum: [excluded, included]
        paperTradeLeadMinutes:
          type: integer

    UpdatePredictionSettingsRequest:
      type: object
      properties:
        retirementRule:
          type: string
          enum: [excluded, included]
        paperTradeLeadMinutes:
          type: integer
          minimum: 1
          maximum: 1440

    PaperTradingCycleSummary:
      type: object
      required: [locked, missed, graded, errors]
      properties:
        locked:
          type: integer
        missed:
          type: integer
        graded:
          type: integer
        errors:
          type: array
          items:
            type: string

    AblationRunResponse:
      type: object
      required: [started]
      properties:
        started:
          type: boolean
        reason:
          type: string
          nullable: true

    AblationStatus:
      type: object
      required: [state]
      properties:
        state:
          type: string
          enum: [idle, running, done, error]
        startedAt:
          type: string
          format: date-time
          nullable: true
        finishedAt:
          type: string
          format: date-time
          nullable: true
        # Free-form: { phase, variantIndex, variantCount, matchIndex, matchCount } while running.
        progress:
          nullable: true
        # Free-form: the full AblationReport (baseline/modelDeltas/combinations/diagnostics) once state is "done".
        report:
          nullable: true
        reportPath:
          type: string
          nullable: true
        markdownPath:
          type: string
          nullable: true
        error:
          type: string
          nullable: true

    JobRun:
      type: object
      required: [id, jobName, startedAt, finishedAt, status, attempts]
      properties:
        id:
          type: integer
        jobName:
          type: string
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [success, failed]
        attempts:
          type: integer
        summary:
          nullable: true
        errorMessage:
          type: string
          nullable: true
